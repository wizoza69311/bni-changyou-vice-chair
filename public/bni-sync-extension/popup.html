<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>BNI 同步</title></head><body><main><header><span>BNI</span><div><b>每週資料更新</b><small>長佑分會副主席系統</small></div></header><label class="key-label">同步配對金鑰<input id="key" type="password" autocomplete="off" placeholder="從管理系統貼上一次"></label><button id="save" class="secondary">儲存金鑰</button><label class="schedule"><div><b>每週自動更新</b><small>週四 14:00 更新，週五 09:00 補抓</small></div><input id="auto-sync" type="checkbox" role="switch"></label><button id="sync-all" class="primary">立即更新全部資料</button><details><summary>個別更新</summary><button id="sync">只更新出缺席</button><button id="sync-kpi">只更新會員 KPI</button></details><p id="last-result">尚未執行更新</p><p id="status">請保持 BNI Connect 登入。</p></main><script src="popup.js"></script></body></html>
